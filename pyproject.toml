[tool.poetry]
name = "1erLLM"
version = "0.1.0"
description = ""
authors = ["Mamy-cloud <mamycompteprofessionnel@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.10"
torch = {version = "^2.14.0", source = "pytorch"}
numpy = "<2.3"
datasets = "^5.0.1"
transformers = "^5.17.0"
tqdm = "^4.70.1"
python-dotenv = "^1.0.0"

[tool.poetry.dev-dependencies]
pytest = "^9.0.0"
pytest-cov = "^7.0.0"
mutmut = "^3.8.1"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mutmut]
source_paths = ["src/llm/"]
pytest_add_cli_args_test_selection = ["tests/unit/", "tests/mutation/"]
also_copy = ["tests/"]
timeout_multiplier = 5.0
timeout_constant = 10.0

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
